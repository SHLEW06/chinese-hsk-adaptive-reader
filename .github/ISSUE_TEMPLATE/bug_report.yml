name: Bug report
description: Report a reproducible problem in Chinese Adaptive Reader.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please include only information that is safe to share publicly. Do not include credentials or Firebase configuration files."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome 126 on macOS 14"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include screenshots or logs with sensitive information removed.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install web app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Fetch generated-data inputs
        run: npm run fetch:dict-sources

      - name: Build dictionary artifact
        run: npm run build:dict

      - name: Lint
        run: npm run lint

      - name: Type check web app
        run: npm run typecheck

      - name: Type check Firebase Functions
        run: npm run typecheck:functions

      - name: Unit tests
        run: npm run test:run

      - name: Check HSK coverage report
        run: npm run check:hsk-coverage

      - name: Production build
        run: npm run build
